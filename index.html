<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>FLAPPY PENGUIN 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%A7%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="stage">
  <canvas id="game"></canvas>
  <div id="scanlines"></div>
  <div id="flash"></div>

  <!-- ===== HUD ===== -->
  <div id="hud" class="hidden">
    <div class="hud-row hud-top">
      <div class="stat"><span class="k">SPEED</span><span class="v" id="s-speed">0</span></div>
      <div class="stat"><span class="k">ALT</span><span class="v" id="s-alt">0</span></div>
      <div class="stat"><span class="k">DIST</span><span class="v" id="s-dist">0</span></div>
      <div class="stat"><span class="k">FISH</span><span class="v" id="s-fish">0</span></div>
      <div class="stat"><span class="k">FPS</span><span class="v" id="s-fps">0</span></div>
    </div>
    <div id="state-msg"></div>
  </div>

  <!-- ===== 웹캠 미리보기 ===== -->
  <div id="cam-panel" class="hidden">
    <video id="cam" playsinline muted></video>
    <canvas id="cam-overlay" width="240" height="180"></canvas>
    <div id="cam-bars">
      <div class="bar"><i>선회</i><div class="track"><div class="fill center" id="bar-roll"></div></div></div>
      <div class="bar"><i>양력</i><div class="track"><div class="fill" id="bar-flap"></div></div></div>
    </div>
    <div id="cam-status">CAMERA</div>
  </div>

  <!-- ===== 시작 화면 ===== -->
  <div id="menu">
    <div class="panel">
      <h1>FLAPPY<br><em>PENGUIN</em><span class="tag">3D</span></h1>
      <p class="sub">팔을 펼쳐 펭귄이 되어라</p>

      <ul class="howto">
        <li><b>양팔 수평</b><i>직진</i></li>
        <li><b>오른팔 내리기</b><i>오른쪽 선회</i></li>
        <li><b>왼팔 내리기</b><i>왼쪽 선회</i></li>
        <li><b>파닥파닥 날갯짓</b><i>상승</i></li>
        <li><b>가만히</b><i>하강</i></li>
      </ul>

      <div class="btns">
        <button id="btn-cam" class="primary">▶ 웹캠으로 시작</button>
        <button id="btn-key">⌨ 키보드로 시작</button>
      </div>
      <p class="hint" id="menu-hint">웹캠 모드는 카메라 권한이 필요합니다. 상반신이 보이도록 1~2m 떨어져 주세요.</p>
    </div>
  </div>

  <!-- ===== 로딩 ===== -->
  <div id="loading" class="hidden"><div class="panel"><div class="spin">🐧</div><p id="load-msg">모션 인식 엔진 로딩중...</p></div></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
